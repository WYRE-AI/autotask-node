name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow Manual Release (and other callers) to publish without relying on a
  # GITHUB_TOKEN tag push, which does not start push-triggered workflows.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  packages: write # to be able to publish to GitHub Packages

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag ref
        id: tag
        env:
          # Prefer env over ${{ inputs.* }} interpolation in shell (zizmor).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Fully qualify tags so checkout prefers the tag over a same-named branch.
            echo "NAME=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "CHECKOUT_REF=refs/tags/${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            # Bind push runs to the triggering commit (not a floating tag tip).
            echo "NAME=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "CHECKOUT_REF=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.CHECKOUT_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@wyre-technology"

      - name: Install dependencies
        run: npm clean-install

      - name: Build project
        run: npm run build

      - name: Extract version from tag
        id: extract_version
        env:
          TAG_NAME: ${{ steps.tag.outputs.NAME }}
        run: echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Check and update package.json version
        env:
          TARGET_VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "Target version: $TARGET_VERSION"
          if [ "$CURRENT_VERSION" != "$TARGET_VERSION" ]; then
            echo "Updating version from $CURRENT_VERSION to $TARGET_VERSION"
            npm version "$TARGET_VERSION" --no-git-tag-version
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          echo "Extracting release notes for version $VERSION"
          awk -v version="$VERSION" '
          BEGIN { found=0; content="" }
          /^## [0-9]+\.[0-9]+\.[0-9]+ release notes/ {
            if (found) exit
            if ($2 == version) found=1
            next
          }
          found && !/^#/ {
            if (content == "" && $0 == "") next
            content = content $0 "\n"
          }
          END {
            gsub(/\n+$/, "", content)
            print content
          }' CHANGELOG.md > release-notes.md
          echo "Release notes extracted"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.NAME }}
          name: Release ${{ steps.tag.outputs.NAME }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
