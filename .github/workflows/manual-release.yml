name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0, 1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      acknowledge:
        description: 'Confirm production release (create tag, open PR, publish). Required when dry_run is false.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  prepare:
    name: Prepare release branch and tag
    runs-on: ubuntu-latest

    steps:
      - name: Require acknowledgement for production release
        if: ${{ !inputs.dry_run && !inputs.acknowledge }}
        run: |
          echo "Error: set acknowledge=true to perform a real release (or enable dry_run)."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm clean-install

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests (if credentials available)
        env:
          AUTOTASK_USERNAME: ${{ secrets.AUTOTASK_USERNAME }}
          AUTOTASK_INTEGRATION_CODE: ${{ secrets.AUTOTASK_INTEGRATION_CODE }}
          AUTOTASK_SECRET: ${{ secrets.AUTOTASK_SECRET }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_CONTACT_ID: ${{ secrets.TEST_CONTACT_ID }}
          TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
        run: npm run test:integration

      - name: Build project
        run: npm run build --if-present

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format x.y.z (e.g., 1.0.0)"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Error: Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN: Would open PR release/v${{ inputs.version }} → main with package.json bump"
          echo "DRY RUN: Would create and push tag v${{ inputs.version }}"
          echo "DRY RUN: Would call release.yml via workflow_call to publish"
          echo "DRY RUN: Would NOT push commits directly to main (branch protection)"

      # Under branch protection, GITHUB_TOKEN cannot push commits to main (GH006).
      # Tag pushes with GITHUB_TOKEN also do not start push-triggered workflows, so
      # publishing is invoked explicitly via workflow_call on the Release workflow.
      - name: Open release PR and push tag
        if: ${{ !inputs.dry_run && inputs.acknowledge }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          npm version "$VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION}"

          git tag -a "$TAG" -m "Release ${TAG}"

          git push origin "$BRANCH"
          git push origin "$TAG"

          # PR body written via printf so YAML block scalar stays valid.
          {
            echo "## Release ${TAG}"
            echo
            echo "Automated version bump from the Manual Release workflow."
            echo
            echo "### Why a PR?"
            echo "\`main\` is branch-protected (required review, enforced for admins). Direct"
            echo "pushes from \`GITHUB_TOKEN\` are rejected (GH006). This PR carries the"
            echo "\`package.json\` / lockfile version bump for review and merge."
            echo
            echo "### Publishing"
            echo "Tag \`${TAG}\` was pushed, and Manual Release calls"
            echo "[\`release.yml\`](.github/workflows/release.yml) via \`workflow_call\`"
            echo "(GitHub Release + npm publish). Tag push alone from \`GITHUB_TOKEN\`"
            echo "would not start push-triggered workflows."
            echo "Publishing does **not** require this PR to be merged first; merge keeps"
            echo "\`main\`'s version in sync."
            echo
            echo "### Merge"
            echo "Approve and merge when ready. Do not force-push."
          } > /tmp/release-pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release ${TAG}" \
            --body-file /tmp/release-pr-body.md

          echo "Opened PR for ${BRANCH}; pushed tag ${TAG}"

  publish:
    name: Publish release
    needs: prepare
    if: ${{ !inputs.dry_run && inputs.acknowledge }}
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
