# Canonical Dependabot config for the wyre-technology fleet.
#
# Goal: keep PR volume manageable. Updates are GROUPED so this repo gets a
# handful of PRs per week instead of one-per-package. The dependabot-janitor
# (org-level, twice-daily) auto-merges green grouped/minor/patch PRs and
# dev/CI-tooling majors; runtime majors are held for human review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # No patched version available upstream as of 2026-05-07
      - dependency-name: "ip-address"
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # uuid is both a direct dependency AND a top-level override (added in #175 to
      # force any transitive uuid usage up to the patched v14 line, alongside the
      # brace-expansion/diff overrides above -- a real security-hardening pin, not
      # vestigial). npm requires a top-level override for a package that's also a
      # direct dependency to match EXACTLY, so any Dependabot attempt to bump the
      # override alone (independent of the dependencies entry) throws EOVERRIDE and
      # fails the whole production-minor-patch group's recreate job -- reproduced
      # 2026-08-13 and 2026-08-17 (npm error: "Override for uuid@14.0.1 conflicts
      # with direct dependency"). Bump uuid manually (both dependencies AND
      # overrides, same value) instead of via Dependabot.
      - dependency-name: "uuid"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
