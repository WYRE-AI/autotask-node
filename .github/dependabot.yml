# Canonical Dependabot config for the wyre-technology fleet.
#
# Goal: keep PR volume manageable. Updates are GROUPED so this repo gets a
# handful of PRs per week instead of one-per-package. The dependabot-janitor
# (org-level, twice-daily) auto-merges green grouped/minor/patch PRs and
# dev/CI-tooling majors; runtime majors are held for human review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # No patched version available upstream as of 2026-05-07
      - dependency-name: "ip-address"
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # uuid is BOTH a direct dependency and a top-level `overrides` entry (added
      # together in the uuid 11->14 major bump -- the override is load-bearing,
      # forcing bull/exceljs's own transitive uuid deps up to 14.x instead of
      # resolving independently to 8.3.2; do NOT remove it as "redundant").
      # npm requires the two fields to match EXACTLY, not just range-compatibly,
      # so Dependabot's grouped update tries to bump the override alone and fails
      # with dependency_file_not_resolvable. Ignored here; bump both fields
      # manually together when a real update is needed (task_1787660405923_49563022).
      - dependency-name: "uuid"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
