# Canonical Dependabot config for the wyre-technology fleet.
#
# Goal: keep PR volume manageable. Updates are GROUPED so this repo gets a
# handful of PRs per week instead of one-per-package. The dependabot-janitor
# (org-level, twice-daily) auto-merges green grouped/minor/patch PRs and
# dev/CI-tooling majors; runtime majors are held for human review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # CORRECTED 2026-08-26 (task_1787194027987_81046423): the original comment
      # here said "no patched version available upstream" -- that was true on
      # 2026-05-07 but is now stale; ip-address has published patches through
      # 10.5.0. This ignore is kept for a DIFFERENT reason: the only remaining
      # vulnerable copy is nested inside npm's own bundled dependency tree
      # (node_modules/npm/node_modules/ip-address@10.1.0), unreachable from
      # top-level dependency management -- same shape as tar/undici/etc below.
      # The reachable top-level copy was bumped to 10.5.0 in this same pass.
      - dependency-name: "ip-address"
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # uuid is BOTH a direct dependency and a top-level `overrides` entry (added
      # together in the uuid 11->14 major bump -- the override is load-bearing,
      # forcing bull/exceljs's own transitive uuid deps up to 14.x instead of
      # resolving independently to 8.3.2; do NOT remove it as "redundant").
      # npm requires the two fields to match EXACTLY, not just range-compatibly,
      # so Dependabot's grouped update tries to bump the override alone and fails
      # with dependency_file_not_resolvable. Ignored here; bump both fields
      # manually together when a real update is needed (task_1787660405923_49563022).
      - dependency-name: "uuid"
      # Nested-unreachable inside npm's own bundled dependency tree (same shape
      # as ip-address above and the node-halopsa/7-repo-batch fixes 2026-08-25):
      # every vulnerable copy of these lives under node_modules/npm/node_modules/,
      # not reachable from top-level dependency management. tar's top-level copy
      # (node_modules/tar) and undici's top-level + other-nested copies are
      # already on patched versions -- only the npm-bundled copy is stuck.
      # @sigstore/core, @sigstore/verify, and sigstore have NO copy outside
      # npm's bundled tree at all. Triaged during the 2026-08-26 open-alerts pass
      # (task_1787194027987_81046423). Revisit once npm bundles patched versions.
      - dependency-name: "tar"
      - dependency-name: "undici"
      - dependency-name: "@sigstore/core"
      - dependency-name: "@sigstore/verify"
      - dependency-name: "sigstore"
      # brace-expansion has a SPLIT shape: the reachable top-level copy (2.x line)
      # is fixed directly in this same pass (2.1.0 -> patched), but a second,
      # unrelated vulnerable copy (5.x line, node_modules/npm/node_modules/) is
      # nested-unreachable the same way as the packages above. Ignored so
      # Dependabot doesn't keep trying and failing to bump the unreachable copy
      # after the reachable one is already fixed manually.
      - dependency-name: "brace-expansion"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
